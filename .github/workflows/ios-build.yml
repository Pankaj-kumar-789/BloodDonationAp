name: Build iOS App (Simulator)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies
      run: npm install

    - name: Sync Capacitor
      run: npx cap sync ios

    - name: Build iOS App
      working-directory: ./ios/App
      run: |
        xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

    - name: Zip iOS App
      working-directory: ./ios/App/build/Build/Products/Debug-iphonesimulator
      run: zip -r app-simulator.zip App.app

    - name: Upload iOS App Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-simulator.zip
        path: ios/App/build/Build/Products/Debug-iphonesimulator/app-simulator.zip
